<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LEGEND OF ELDORIA — Whispering Forest Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#091c19;color:#f5ecd5;font:14px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;top:env(safe-area-inset-top);left:10px;right:10px;pointer-events:none;text-shadow:0 2px 4px #000}header b{font-size:17px}header small{display:block;color:#c0d9bf}#message{position:fixed;bottom:calc(105px + env(safe-area-inset-bottom));left:12px;right:12px;text-align:center;background:#102b27db;padding:9px;border:1px solid #7d986b;border-radius:12px;pointer-events:none}#pad{position:fixed;bottom:calc(15px + env(safe-area-inset-bottom));left:18px;display:grid;grid-template-columns:repeat(3,48px);gap:4px}button{height:46px;background:#233f34d9;color:#fff;border:1px solid #91aa80;border-radius:12px;font-size:23px;touch-action:none}#action{position:fixed;right:18px;bottom:calc(35px + env(safe-area-inset-bottom));width:86px;height:55px;font-size:15px}#pad button:first-child{grid-column:2}</style></head><body><canvas id="game"></canvas><header><b>LEGEND OF ELDORIA</b><small>Whispering Forest · Safari Preview · ทดลองแยกจากเกมหลัก</small></header><div id="message">แตะบนแผนที่เพื่อเดินสำรวจ หรือใช้ปุ่มทิศทาง</div><div id="pad"><button data-d="0,-1">▲</button><button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button></div><button id="action">สำรวจ</button><script>const c=document.getElementById('game'),g=c.getContext('2d'),msg=document.getElementById('message');let W,H,scale,px=6,py=7,target=null;const N=15,objects=[['🌳',2,2],['🌲',5,1],['🌳',11,3],['🌲',13,8],['🌳',3,11],['🌲',10,12],['🌸',1,8],['🌳',8,2],['🌲',12,11],['🌳',4,4],['🌲',1,12],['🌳',12,1],['🍄',5,9],['🍄',10,6],['🔥',8,9],['🧰',10,10],['🌀',7,3],['🌉',7,12]];function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);scale=Math.min(innerWidth/17,innerHeight/24,27)}onresize=resize;resize();function iso(x,y){return [innerWidth/2+(x-y)*scale*.95,innerHeight*.43+(x+y-14)*scale*.48]}function tile(x,y,color){const [a,b]=iso(x,y);g.beginPath();g.moveTo(a,b-scale*.48);g.lineTo(a+scale*.95,b);g.lineTo(a,b+scale*.48);g.lineTo(a-scale*.95,b);g.closePath();g.fillStyle=color;g.fill();g.strokeStyle='#1c493a';g.lineWidth=.7;g.stroke()}function draw(){g.clearRect(0,0,innerWidth,innerHeight);const bg=g.createLinearGradient(0,0,0,innerHeight);bg.addColorStop(0,'#132f2a');bg.addColorStop(1,'#071613');g.fillStyle=bg;g.fillRect(0,0,innerWidth,innerHeight);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let path=Math.abs(x-7)<2||Math.abs(y-7)<2;tile(x,y,path?'#53694a':(x+y)%3?'#28533b':'#2d6042')}const sprites=objects.map(o=>({...{e:o[0],x:o[1],y:o[2]},depth:o[1]+o[2]}));sprites.push({e:'🧙',x:px,y:py,depth:px+py,hero:true});sprites.sort((a,b)=>a.depth-b.depth);for(const o of sprites){let [a,b]=iso(o.x,o.y);g.textAlign='center';g.textBaseline='bottom';g.font=(o.hero?scale*1.9:scale*2.1)+'px serif';g.shadowColor='#06130b';g.shadowBlur=8;g.fillText(o.e,a,b+scale*.3);g.shadowBlur=0}requestAnimationFrame(draw)}draw();function walk(x,y){px=Math.max(0,Math.min(14,x));py=Math.max(0,Math.min(14,y));const o=objects.find(q=>Math.abs(q[1]-px)+Math.abs(q[2]-py)<=1);if(o)msg.textContent=o[0]==='🌀'?'ประตูวาร์ปโบราณ — ยังไม่เปิดการเดินทาง':o[0]==='🧰'?'พบหีบสมบัติ! (ตัวอย่าง)':o[0]==='🔥'?'กองไฟพักแรม — ปลอดภัย':o[0]==='🌉'?'สะพานสู่พื้นที่ถัดไป (ตัวอย่าง)':'Whispering Forest — สำรวจต่อได้เลย';else msg.textContent='กำลังสำรวจป่า Whispering Forest'}c.addEventListener('pointerdown',e=>{let best=null,d=1e9;for(let y=0;y<N;y++)for(let x=0;x<N;x++){let [a,b]=iso(x,y),v=(a-e.clientX)**2+(b-e.clientY)**2;if(v<d){d=v;best=[x,y]}}if(best)walk(...best)});document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();let [dx,dy]=b.dataset.d.split(',').map(Number);walk(px+dx,py+dy)}));document.getElementById('action').onclick=()=>{const o=objects.find(q=>Math.abs(q[1]-px)+Math.abs(q[2]-py)<=2);msg.textContent=o?'กำลังสำรวจ '+o[0]+' — ฟีเจอร์โต้ตอบอยู่ในขั้นทดลอง':'เดินเข้าใกล้วัตถุแล้วกดสำรวจ'};</script></body></html>
